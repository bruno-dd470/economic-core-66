[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-core-66"
version = "1.0.0"
description = "Noyau endorégulé Cl(6,6) pour la modélisation économique"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Bruno DE DOMINICIS"}]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "networkx>=2.5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "mypy"]
viz = ["matplotlib", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]
